[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mobility-data-platform"
version = "1.0.0"
description = "Real-Time Mobility Data Platform & Analytics Lakehouse"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
