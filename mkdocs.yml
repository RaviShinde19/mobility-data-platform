site_name: Mobility Data Platform
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.keys
  - tables
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Implementation Plan: implementation_plan.md
  - Data Dictionary: data_dictionary.md
  - Governance & Security: data_governance_and_security.md
  - Metrics Reference: v1_v2_metrics_reference.md
  - Phase Walkthroughs:
    - Phase 1 — Data Generation: phase1_walkthrough.md
    - Phase 2 — PostgreSQL Planning: phase2_planning.md
    - Phase 2 — PostgreSQL Walkthrough: phase2_walkthrough.md
    - Phase 2 — Complete Guide: phase2_complete_guide.md

